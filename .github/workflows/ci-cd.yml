name: CI/CD Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend - Lint y pruebas unitarias (100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-Code/MedicalAppointment/backend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 03-Code/MedicalAppointment/backend/package-lock.json

      - name: Instalar las dependencias
        run: npm ci

      - name: Ejecutar lint del código
        run: npm run lint

      - name: Ejecutar pruebas unitarias (appointment + doctor + patients)
        run: npm run test:coverage:all

  frontend-build:
    name: Frontend - Build de verificación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-Code/MedicalAppointment/frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 03-Code/MedicalAppointment/frontend/package-lock.json

      - name: Instalar las dependencias
        run: npm ci

      - name: Compilar el proyecto (valida que el build no esté roto)
        run: npm run build

  despliegue-produccion:
    name: Desplegar Frontend en Vercel
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: 03-Code/MedicalAppointment/frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 03-Code/MedicalAppointment/frontend/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obtener configuración de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construir el proyecto
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar en producción
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
